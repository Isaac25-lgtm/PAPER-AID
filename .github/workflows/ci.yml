name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,cloud]"  # cloud: the production auth and task-verification paths are tested too
      - run: ruff check app tests
      - name: pytest
        # Failing tests are also printed as annotations, so they show on the commit page.
        run: |
          set -o pipefail
          pytest -q -rfE 2>&1 | tee pytest.txt || { grep -E "^(FAILED|ERROR)" pytest.txt | head -20 | sed 's/^/::error::/'; exit 1; }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: No provider secrets in the bundle
        run: "! grep -rEi 'sk-ant-|sk-proj-|ANTHROPIC_API_KEY|OPENAI_API_KEY' dist"
