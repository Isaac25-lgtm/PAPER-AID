name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -c constraints.txt -e ".[dev,cloud]"
      - run: ruff check app tests
      - name: Generate synthetic fixtures
        run: python tests/fixtures/generate.py
      - name: Build the candidate image
        run: docker build --build-arg WITH_LIBREOFFICE=true -t paperaid-ci .
      - name: Check native rendering and installed dependency consistency
        run: |
          docker run --rm --entrypoint python paperaid-ci -m app.works.render
          docker run --rm --entrypoint python paperaid-ci -m pip check
      - name: pytest
        # The suite runs inside the candidate Linux image (its Python, pinned packages, LibreOffice and the
        # parsers' Linux memory and CPU limits), on the checked-out commit. The checkout is mounted writable:
        # the fixture tests write their documents and one test starts separate processes from it (read-only,
        # 9 tests failed for that reason alone on b87db0abd). Provider calls are blocked by tests/conftest.py.
        run: |
          set -o pipefail
          docker run --rm --user 0 -v "$PWD/..:/workspace" --workdir /workspace/backend --entrypoint sh paperaid-ci -c \
            'pip install --no-cache-dir -q -c constraints.txt pytest pytest-xdist statsmodels && python -m pytest tests -q -n 2 -rfE -p no:cacheprovider --basetemp=/tmp/pt' \
            2>&1 | tee pytest.txt || { grep -E "^(FAILED|ERROR)" pytest.txt | head -20 | sed 's/^/::error::/'; exit 1; }

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: No provider secrets in the bundle
        run: "! grep -rEi 'sk-ant-|sk-proj-|ANTHROPIC_API_KEY|OPENAI_API_KEY' dist"
