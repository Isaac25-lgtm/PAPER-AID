[project]
name = "paperaid-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "python-multipart>=0.0.9",
  "python-docx>=1.2",
  "pypdf>=5",
  "anthropic>=1.0",
  "openai>=1.50",
  "httpx>=0.27",  # the source check reads source pages to confirm quotations
  "pillow>=11",  # the conceptual framework figure (2026-10-01)
  # Data Lab (2026-10-03): reading, statistics, charts, the workbook and district maps, all by code
  "numpy>=2",
  "pandas>=2.2",
  "scipy>=1.13",
  "pyarrow>=17",
  "openpyxl>=3.1",
  "xlsxwriter>=3.2",
  "matplotlib>=3.9",
  "shapely>=2.0",
  "pyproj>=3.6",
  "pyogrio>=0.9",
  "geopandas>=1.0",
]

[project.optional-dependencies]
cloud = [
  "firebase-admin>=6.5",
  "google-cloud-firestore>=2.18",
  "google-cloud-storage>=2.18",
  "google-cloud-tasks>=2.16",
]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "statsmodels>=0.14"]  # statsmodels: an independent check of the Data Lab statistics

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = ["E501", "B008", "UP047"]

[tool.ruff.lint.per-file-ignores]
# LaTeX is written with %-formatting: f-strings would need every LaTeX brace doubled.
"app/latex/convert.py" = ["UP031"]

[tool.pytest.ini_options]
testpaths = ["tests"]
